<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Under Renovation | Lilia Potseluyko</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #1DCD9F;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #169976;
            transform: translateX(-4px);
        }

        .renovation-container {
            text-align: center;
            max-width: 650px;
            padding: 40px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 25px;
        }

        h1 {
            color: #1DCD9F;
            font-size: clamp(36px, 6vw, 64px);
            margin: 0 0 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #cccccc;
            margin: 0 auto;
        }

        .date {
            color: #e9008c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">
        ← Back to main page
    </a>

    <main class="renovation-container">

        <div class="icon">⚒️</div>

        <h1>Website under renovation</h1>

        <p>
            I'm currently updating my portfolio with new projects,
            research and case studies.
            <br><br>
            The completed website will be available by
            <span class="date">mid-August 2026</span>.
        </p>

    </main>

</body>
</html>
